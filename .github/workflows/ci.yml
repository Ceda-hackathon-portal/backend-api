name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Language steps run only for the stack that is present in the repository.
      - name: Set up Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Node install and test
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm test --if-present

      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python install and test
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .; fi
          if [ -d tests ]; then pip install pytest && pytest; fi

  container:
    # Builds the production image and checks the health endpoint the load balancer will use.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t backend-api:ci .

      - name: Smoke test GET /health
        if: hashFiles('Dockerfile') != ''
        run: |
          docker run -d --name api -p 8080:8080 -e PORT=8080 -e APP_ENV=ci backend-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "Container did not answer GET /health within 60 seconds"
          docker logs api
          exit 1
