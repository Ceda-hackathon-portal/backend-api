name: CI

# Adapted from the backend team's original backend-ci.yml, with the code now at the repository root.
# Every job is skipped until the application code is migrated in (no package-lock.json yet).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned, as in the original backend CI
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f package-lock.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No application code yet. Backend checks are skipped."
          fi

  verify:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pinned, as in the original backend CI
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke
      - name: Eligibility policy tests when present in the reviewed tree
        shell: bash
        run: |
          if git ls-files --error-unmatch tests/eligibilityPolicy.test.mjs >/dev/null 2>&1; then
            node --test tests/eligibilityPolicy.test.mjs
          fi
      - name: Generated files are committed
        run: git diff --exit-code

  postgres:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_DB: ceda_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:ci-only@127.0.0.1:5432/ceda_test
      NODE_ENV: test
      DATABASE_SSL: 'false'
      DATABASE_STATEMENT_TIMEOUT_MS: '100'
      DATABASE_LOCK_TIMEOUT_MS: '100'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      DATABASE_POOL_MAX: '2'
      LOG_LEVEL: silent
      DISPOSABLE_POSTGRES_SERVICE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations
        run: npm run db:migrate
      - name: Re-apply migrations (must be a no-op)
        run: npm run db:migrate
      - run: npx --no-install prisma migrate status
      - name: Exercise the disposable database
        run: |
          mkdir -p .runtime
          DISPOSABLE_DATABASE_RUN="$(cat /proc/sys/kernel/random/uuid)" node --test dist/tests/*.integration.test.js

  container:
    # Builds the production image and checks the liveness endpoint a load balancer or health check will use.
    # /health/live does not touch PostgreSQL, so an unreachable database URL is enough here.
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t backend-api:ci .
      - name: Smoke test GET /health/live
        run: |
          docker run -d --name api -p 127.0.0.1:3001:3001 \
            -e NODE_ENV=test -e HOST=0.0.0.0 -e PORT=3001 \
            -e AUTH_ENABLED=false -e DATABASE_SSL=false \
            -e DATABASE_URL=postgresql://fixture@127.0.0.1:1/unreachable \
            backend-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health/live; then echo; exit 0; fi
            sleep 2
          done
          echo "Container did not answer GET /health/live within 60 seconds"
          docker logs api
          exit 1
